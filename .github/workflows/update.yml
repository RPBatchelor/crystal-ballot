# Pushes (main and dev): test, publish and build the site from committed data (fast).
# Daily / manual: refresh polls, refit the poll aggregate, rerun the seat forecast,
# commit the refreshed data back to main, then build. Deploy is added with hosting.
name: update

on:
  schedule:
    - cron: "0 19 * * *" # 06:00 AEDT
  workflow_dispatch:
  push:
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  # Per branch, so a dev push never waits behind the daily run on main.
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    # Pinned, not ubuntu-latest: the move to 26.04 (Nov 2026) changed the toolchain
    # and Python under the frozen model and broke the CmdStan build.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Wikimedia robot policy: identify the client with a contact URL.
      PROPHECY_USER_AGENT: "prophecy-election-model/0.1 (https://github.com/${{ github.repository }})"
      FULL_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.7"

      - name: Install pipeline
        working-directory: pipeline
        run: uv sync

      - name: Cache CmdStan
        if: env.FULL_RUN == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          # ImageOS (e.g. ubuntu24) in the key: a CmdStan built on one image aborts
          # (SIGABRT, code -6) when its compiled libraries are reused on another.
          key: cmdstan-2.40.0-${{ runner.os }}-${{ env.ImageOS }}

      - name: Install CmdStan
        if: env.FULL_RUN == 'true'
        working-directory: pipeline
        run: uv run python -c "import cmdstanpy; cmdstanpy.install_cmdstan(version='2.40.0', progress=False, cores=4)"

      - name: Refresh polls
        if: env.FULL_RUN == 'true'
        working-directory: pipeline
        run: |
          uv run prophecy ingest-polls --jurisdiction VIC
          uv run prophecy ingest-polls --jurisdiction FED

      # Victoria first, committed on its own, so a slow federal fit never holds it back.
      - name: Victorian poll aggregate and seat forecast
        if: env.FULL_RUN == 'true'
        timeout-minutes: 50
        working-directory: pipeline
        run: |
          # 500 draws per chain (2000 total) keeps the fit near 25 min on a 4-core runner;
          # 10 simulations per draw keeps the forecast at 20,000.
          uv run prophecy aggregate --election vic-2026 --iter-sampling 500
          uv run prophecy forecast --election vic-2026 --n-per-draw 10

      - name: Test
        working-directory: pipeline
        run: uv run pytest -q

      - name: Publish site data
        working-directory: pipeline
        run: |
          uv run prophecy publish --election vic-2026 --validated
          uv run prophecy publish --election fed-next

      - name: Commit Victorian update
        if: env.FULL_RUN == 'true'
        run: |
          git config user.name "crystal-ballot-bot"
          git config user.email "crystal-ballot-bot@users.noreply.github.com"
          git add data/processed web/static/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Daily forecast update $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      # Federal trend: best effort. On timeout or failure the last committed fit stays.
      - name: Federal poll aggregate
        id: fed
        if: env.FULL_RUN == 'true'
        timeout-minutes: 30
        continue-on-error: true
        working-directory: pipeline
        run: |
          uv run prophecy aggregate --election fed-next --iter-sampling 500
          uv run prophecy publish --election fed-next

      - name: Commit federal update
        if: env.FULL_RUN == 'true' && steps.fed.outcome == 'success'
        run: |
          git add data/processed web/static/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Daily federal poll trend $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/build
