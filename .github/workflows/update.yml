# Pushes: test, publish and build the site from committed data (fast).
# Daily / manual: refresh polls, refit the poll aggregate, rerun the seat forecast,
# commit the refreshed data back to main, then build. Deploy is added with hosting.
name: update

on:
  schedule:
    - cron: "0 19 * * *" # 06:00 AEDT
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Wikimedia robot policy: identify the client with a contact URL.
      PROPHECY_USER_AGENT: "prophecy-election-model/0.1 (https://github.com/${{ github.repository }})"
      FULL_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.7"

      - name: Install pipeline
        working-directory: pipeline
        run: uv sync

      - name: Cache CmdStan
        if: env.FULL_RUN == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-2.40.0-${{ runner.os }}

      - name: Install CmdStan
        if: env.FULL_RUN == 'true'
        working-directory: pipeline
        run: uv run python -c "import cmdstanpy; cmdstanpy.install_cmdstan(version='2.40.0', progress=False, cores=4)"

      - name: Refresh polls
        if: env.FULL_RUN == 'true'
        working-directory: pipeline
        run: |
          uv run prophecy ingest-polls --jurisdiction VIC
          uv run prophecy ingest-polls --jurisdiction FED

      - name: Poll aggregate and seat forecast
        if: env.FULL_RUN == 'true'
        working-directory: pipeline
        run: |
          uv run prophecy aggregate --election vic-2026
          uv run prophecy forecast --election vic-2026
          uv run prophecy aggregate --election fed-next --iter-sampling 2000

      - name: Test
        working-directory: pipeline
        run: uv run pytest -q

      - name: Publish site data
        working-directory: pipeline
        run: |
          uv run prophecy publish --election vic-2026
          uv run prophecy publish --election fed-next

      - name: Commit refreshed data
        if: env.FULL_RUN == 'true'
        run: |
          git config user.name "prophecy-bot"
          git config user.email "prophecy-bot@users.noreply.github.com"
          git add data/processed web/static/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Daily forecast update $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/build
