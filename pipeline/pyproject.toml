[project]
name = "prophecy"
version = "0.1.0"
description = "Bayesian seat-level forecasting for Australian elections"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.9",
    "duckdb>=1.1",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.14",
    "cmdstanpy>=1.2",
    "arviz>=0.20",
    "pydantic>=2.9",
    "httpx>=0.27",
    "typer>=0.12",
    "openpyxl>=3.1",
    "fastexcel>=0.21.0",
    "xlrd>=2.0.2",
    "shapely>=2.2.0",
]

[project.scripts]
prophecy = "prophecy.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prophecy"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
